name: Auto Fix

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint Fix
        working-directory: ./frontend
        run: npx eslint . --ext .ts,.tsx --fix

      - name: Run Prettier
        working-directory: ./frontend
        run: npx prettier --write "src/**/*.{ts,tsx}"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "style: auto-fix code style issues"
          branch: ${{ github.head_ref }}
          file_pattern: 'frontend/src/**/*.{ts,tsx}'
