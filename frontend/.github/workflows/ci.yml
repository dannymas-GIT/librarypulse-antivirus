name: Frontend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'antivirus/frontend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'antivirus/frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./antivirus/frontend

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './antivirus/frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Run tests
      run: npm run test -- --run

    - name: Build
      run: npm run build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image for scanning
      uses: docker/build-push-action@v4
      with:
        context: ./antivirus/frontend
        push: false
        load: true
        tags: antivirus-frontend:${{ github.sha }}

    - name: Cache Trivy vulnerability database
      uses: actions/cache@v3
      with:
        path: ~/.cache/trivy
        key: trivy-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          trivy-${{ runner.os }}-

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: antivirus-frontend:${{ github.sha }}
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        scanners: 'vuln'
        severity: 'CRITICAL,HIGH'
        timeout: '5m'

    - name: Login to DockerHub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v4
      with:
        context: ./antivirus/frontend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/antivirus-frontend:latest
          ${{ secrets.DOCKER_USERNAME }}/antivirus-frontend:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/antivirus-frontend:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/antivirus-frontend:buildcache,mode=max 