name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: antivirus/frontend/package-lock.json
      
      - name: Run SAST Scan
        uses: github/codeql-action/init@v2
        with:
          languages: javascript
          queries: security-and-quality
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        
      - name: Run Dependency Check
        working-directory: ./antivirus/frontend
        run: |
          npm ci
          npm audit

  test-and-build:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: antivirus/frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./antivirus/frontend
        run: |
          npm ci

      - name: Run Linting
        working-directory: ./antivirus/frontend
        run: |
          npm run lint

      - name: Run Tests with Coverage
        working-directory: ./antivirus/frontend
        run: |
          npm run test:coverage

      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./antivirus/frontend/coverage
          flags: frontend
          name: frontend-coverage

      - name: Build Application
        working-directory: ./antivirus/frontend
        run: |
          npm run build

      - name: Cache Build
        uses: actions/cache@v3
        with:
          path: antivirus/frontend/dist
          key: ${{ runner.os }}-build-${{ github.sha }}

  docker-build-push:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push
        working-directory: ./antivirus/frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/librarypulse-antivirus:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/librarypulse-antivirus:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/librarypulse-antivirus:latest
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker push ${{ secrets.DOCKER_USERNAME }}/librarypulse-antivirus:${{ github.sha }}
            docker push ${{ secrets.DOCKER_USERNAME }}/librarypulse-antivirus:latest
          fi

      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/librarypulse-antivirus:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy:
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            # Update deployment script
            cd /opt/librarypulse
            
            # Backup current state
            docker-compose ps > deployment.state
            
            # Pull the new image
            docker-compose pull antivirus-frontend
            
            # Start new container
            docker-compose up -d --no-deps antivirus-frontend
            
            # Wait for container to start
            echo "Waiting for new deployment to start..."
            sleep 15
            
            # Verify container is running
            if ! docker-compose ps | grep -q "antivirus-frontend.*Up"; then
              echo "Deployment failed - container not running"
              exit 1
            fi
            
            # Cleanup
            docker system prune -f --volumes
            
            echo "Deployment completed successfully"

      - name: Notify Deployment Status
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
          SLACK_MESSAGE: 'Antivirus Frontend Deployment ${{ job.status }}'
          SLACK_TITLE: Deployment Status 